<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Surprise 💛</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        body {
            background: #000000;
            position: relative;
        }

       .float-heart {
            position: absolute;
            font-size: 20px;
            animation: floatUp linear infinite;
            opacity: 0.6;
            z-index: 0;
            filter: drop-shadow(0 0 8px currentColor);
            pointer-events: none;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
        }

       .container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            padding: 20px 15px 70px;
            position: relative;
            z-index: 1;
        }

       .messages-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 400px;
        }

       .msg-bubble {
            background: linear-gradient(135deg, #ff1a8c 0%, #e6167a 100%);
            color: white;
            padding: 11px 20px;
            border-radius: 22px;
            font-size: 15px;
            font-weight: 600;
            box-shadow: 0 0 15px rgba(255, 26, 140, 0.5);
            width: fit-content;
            max-width: 85%;
            opacity: 0;
            transform: scale(0.8) translateX(-20px);
            transition: all 0.3s ease;
            pointer-events: none;
        }

       .msg-bubble.show {
            opacity: 1;
            transform: scale(1) translateX(0);
            pointer-events: all;
        }

       .msg-bubble:active { transform: scale(0.96); }

       .next-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #ff1744;
            color: white;
            padding: 12px 32px;
            border-radius: 25px;
            border: none;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(255, 23, 68, 0.7);
            display: none;
            z-index: 100;
        }

       .next-btn.show {
            display: block;
            animation: bounceIn 0.4s;
        }

        @keyframes bounceIn {
            0% { transform: scale(0); }
            60% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

       .tap-hint {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255,255,255,0.4);
            font-size: 16px;
            text-align: center;
            z-index: 5;
            pointer-events: none;
            transition: opacity 0.5s;
        }

       .tap-hint.hide { opacity: 0; }

       .progress {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.5);
            font-size: 13px;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="floatContainer"></div>
    <div class="progress" id="progress">Tap anywhere 0/11</div>
    <div class="tap-hint" id="tapHint">👆 Tap to reveal messages</div>

    <div class="container">
        <div class="messages-list">
            <div class="msg-bubble" id="timeMessage"></div>
            <div class="msg-bubble">Sal bhar mein 😌💗</div>
            <div class="msg-bubble">Sabse payara 🥰🌸</div>
            <div class="msg-bubble">Hota hai 😊💫</div>
            <div class="msg-bubble">Ek din 💗</div>
            <div class="msg-bubble">100 duaye 🙌</div>
            <div class="msg-bubble">De raha hai dil 😌❤️</div>
            <div class="msg-bubble">Tumko Aaj ke din 🥰👀</div>
            <div class="msg-bubble">I wish you 🥰🤎</div>
            <div class="msg-bubble">Happy happy birthday 🎂</div>
            <div class="msg-bubble">Happy Happy birthday 2 you Nandini 🎉</div>
        </div>

        <button class="next-btn" id="nextBtn" onclick="goNext()">Next ▶</button>
    </div>

    <script>
        // Set current time in first message
        function setCurrentTime() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = now.getMinutes();
            const ampm = hours >= 12 ? 'pm' : 'am';
            hours = hours % 12;
            hours = hours ? hours : 12; // 0 ko 12 banao
            const mins = minutes < 10 ? '0' + minutes : minutes;
            const timeString = `${hours}:${mins} ${ampm}`;
            document.getElementById('timeMessage').innerText = timeString;
        }
        setCurrentTime();

        // Floating hearts
        const hearts = ['❤️', '💗', '💖', '💕', '💜', '🤍'];
        const colors = ['#ff1744', '#ff1a8c', '#e91e63', '#ff4081'];
        const container = document.getElementById('floatContainer');

        function createFloat() {
            const el = document.createElement('div');
            el.className = 'float-heart';
            el.innerHTML = hearts[Math.floor(Math.random() * hearts.length)];
            el.style.left = Math.random() * 100 + 'vw';
            el.style.animationDuration = (Math.random() * 4 + 5) + 's';
            el.style.fontSize = (Math.random() * 12 + 14) + 'px';
            el.style.color = colors[Math.floor(Math.random() * colors.length)];
            container.appendChild(el);
            setTimeout(() => el.remove(), 9000);
        }
        setInterval(createFloat, 400);

        // Message reveal logic
        let currentIndex = 0;
        const bubbles = document.querySelectorAll('.msg-bubble');
        const totalMessages = bubbles.length;
        let started = false;

        document.body.addEventListener('click', function(e) {
            if (e.target.tagName === 'BUTTON') return;

            if (!started) {
                started = true;
                document.getElementById('tapHint').classList.add('hide');
            }
            revealNext();
        });

        function revealNext() {
            if (currentIndex < totalMessages) {
                bubbles[currentIndex].classList.add('show');
                currentIndex++;
                document.getElementById('progress').innerText = `${currentIndex}/${totalMessages} revealed`;

                if (currentIndex === totalMessages) {
                    setTimeout(() => {
                        document.getElementById('nextBtn').classList.add('show');
                        document.getElementById('progress').innerText = 'All revealed! 💛';
                    }, 400);
                }
            }
        }

        function goNext() {
            //alert('Sab messages dekh liye! 💛\n\nYahan apna next page link daal de');
            window.location.href = 'page11.html';
        }
    </script>
</body>
</html>
